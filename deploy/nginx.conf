server {
    listen 80;
    server_name retroafiliados.com www.retroafiliados.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name retroafiliados.com www.retroafiliados.com;

    ssl_certificate     /etc/letsencrypt/live/retroafiliados.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/retroafiliados.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 8m;
    keepalive_timeout    65;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/retroafiliados/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

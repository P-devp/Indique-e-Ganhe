[project]
name = "indique-e-ganhe"
version = "1.0.0"
description = "Programa de afiliados - Indique e Ganhe"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["test_api.py", "tests"]
markers = ["integration: integration tests"]

[tool.coverage.run]
source = ["app", "database"]
omit = ["test_*", "tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

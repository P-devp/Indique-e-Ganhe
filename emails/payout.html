<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background-color: #f0f0f0; font-family: Arial, Helvetica, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; }
        .header { background: linear-gradient(135deg, #006600, #00AA00); padding: 30px; text-align: center; }
        .header h1 { color: #ffffff; margin: 0; font-size: 24px; }
        .content { padding: 30px; color: #333; font-size: 14px; line-height: 1.6; }
        .amount { font-size: 32px; font-weight: bold; color: #006600; text-align: center; margin: 20px 0; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .status-approved { background: #e8f5e9; color: #006600; }
        .status-paid { background: #e3f2fd; color: #000080; }
        .status-rejected { background: #fce4ec; color: #c62828; }
        .btn { display: inline-block; background: #006600; color: #ffffff !important; text-decoration: none; padding: 12px 30px; border-radius: 4px; font-weight: bold; }
        .footer { background: #006600; color: #ffffff; padding: 20px; text-align: center; font-size: 11px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>▲ Indique e Ganhe</h1>
        </div>
        <div class="content">
            <h2>Olá, {{name}}!</h2>
            <p>Seu saque foi <strong>{{status_text}}</strong>.</p>
            <div class="amount">R$ {{amount}}</div>
            <p style="text-align: center;">
                <span class="status-badge status-{{status}}">{{status_text}}</span>
            </p>
            <p style="text-align: center; margin-top: 30px;">
                <a href="{{site_url}}/dashboard.html" class="btn">VER MEU PAINEL</a>
            </p>
        </div>
        <div class="footer">
            <p>Indique e Ganhe &copy; 2026</p>
        </div>
    </div>
</body>
</html>

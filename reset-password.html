<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - Indique e Ganhe</title>
    <meta name="description" content="Redefina sua senha do programa de afiliados Retro.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <span style="color: #FF0000;">R</span><span style="color: #00AA00;">e</span><span style="color: #0000FF;">t</span><span style="color: #FFFF00;">r</span><span style="color: #FF00FF;">o</span><span style="color: #00FFFF;"> A</span><span style="color: #FF0000;">f</span><span style="color: #00AA00;">i</span><span style="color: #0000FF;">l</span><span style="color: #FFFF00;">i</span><span style="color: #FF00FF;">a</span><span style="color: #00FFFF;">d</span><span style="color: #FF0000;">o</span><span style="color: #00AA00;">s</span>
            </div>
            <nav class="nav">
                <a href="index.html" class="nav-link">Início</a>
                <a href="login.html" class="nav-link">Login</a>
                <button class="btn btn-tiny" id="theme-toggle" onclick="toggleTheme()" style="margin-left:10px;" title="Alternar tema">&#x25D0; Tema</button>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="signup-section">
            <div class="container">
                <div class="signup-container">
                    <div class="signup-form-wrapper">
                        <h1 class="section-title">Redefinir Senha</h1>
                        <p class="section-subtitle">Digite seu token de recuperação e a nova senha</p>

                        <form id="reset-form" class="signup-form">
                            <div class="form-group">
                                <label for="token" class="form-label">Token de Recuperação*</label>
                                <div class="form-input-wrapper">
                                    <input type="text" id="token" name="token"
                                        placeholder="Cole o token recebido por email"
                                        class="form-input" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="password" class="form-label">Nova Senha*</label>
                                <div class="form-input-wrapper">
                                    <input type="password" id="password" name="password"
                                        placeholder="Mínimo 6 caracteres"
                                        class="form-input" required minlength="6">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary btn-large">
                                Redefinir Senha
                            </button>
                        </form>

                        <div id="reset-success" class="hidden" style="text-align:center;padding:20px;">
                            <div class="success-icon" style="font-size:60px;">&#10003;</div>
                            <h2 style="color:var(--color-green);margin:15px 0;">Senha Redefinida!</h2>
                            <p style="font-size:13px;margin-bottom:20px;">Sua senha foi alterada com sucesso.</p>
                            <a href="login.html" class="btn btn-primary">Fazer Login</a>
                        </div>

                        <div style="text-align:center;margin-top:20px;">
                            <a href="forgot.html" class="btn btn-small">Solicitar novo token</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container" style="text-align:center;padding:12px 0;border-top:2px solid #808080;">
            <a href="termos.html" style="color:#FFFF00;font-size:10px;margin:0 8px;">Termos de Uso</a>
            <a href="privacidade.html" style="color:#FFFF00;font-size:10px;margin:0 8px;">Privacidade</a>
            <span style="color:#808080;font-size:10px;margin:0 8px;">&copy; 2026 Indique e Ganhe</span>
        </div>
    </footer>

    <script src="src/storage.js"></script>
    <script src="src/utils.js"></script>
    <script src="src/main.js"></script>
    <script>
        document.getElementById('reset-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            var token = document.getElementById('token').value.trim();
            var password = document.getElementById('password').value;
            if (password.length < 6) {
                showToast('A senha deve ter no mínimo 6 caracteres');
                return;
            }
            var btn = this.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = 'Redefinindo...';
            try {
                var res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, password: password })
                });
                var data = await res.json();
                if (res.ok) {
                    document.getElementById('reset-form').classList.add('hidden');
                    document.getElementById('reset-success').classList.remove('hidden');
                } else {
                    showToast('Erro: ' + (data.error || 'token inválido ou expirado'));
                    btn.disabled = false;
                    btn.textContent = 'Redefinir Senha';
                }
            } catch (e) {
                showToast('Erro ao conectar ao servidor');
                btn.disabled = false;
                btn.textContent = 'Redefinir Senha';
            }
        });
    </script>
</body>
</html>

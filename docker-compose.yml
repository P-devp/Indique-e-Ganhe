services:
  retro:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./backend/retro.db:/app/backend/retro.db
      - ./backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3

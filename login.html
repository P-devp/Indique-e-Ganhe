<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Indique e Ganhe</title>
    <meta property="og:title" content="Indique e Ganhe">
    <meta property="og:description" content="Programa de afiliados: indique amigos e ganhe comissões mensais!">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://indiqueeganhe.com.br">
    <meta property="og:locale" content="pt_BR">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Indique e Ganhe">
    <meta name="twitter:description" content="Programa de afiliados: indique amigos e ganhe comissões mensais!">
    <link rel="manifest" href="/manifest.json">
    <meta name="description" content="Acesse seu painel de afiliado e acompanhe seus ganhos, cliques e conversões em tempo real.">
    <meta name="theme-color" content="#000080">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▲</text></svg>">
    <meta property="og:title" content="Indique e Ganhe - Login">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/twemoji@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
</head>
<body>
    <a href="#main-content" class="skip-link">Pular para conteúdo principal</a>
    <header class="header" role="banner">
        <div class="container">
            <div class="logo">
                <span class="logo-icon">▲</span>
                <span class="logo-text">Indique <span class="logo-accent">e</span> Ganhe</span>
            </div>
            <button class="nav-toggle" aria-label="Abrir menu" aria-expanded="false" onclick="toggleNav(this)">☰</button>
            <button id="dark-toggle" aria-label="Alternar modo escuro">🌙</button>
            <nav class="nav" role="navigation">
                <a href="index.html" class="nav-link">Início</a>
                <a href="signup.html" class="nav-link guest-link">Cadastro</a>
                <a href="login.html" class="nav-link active guest-link" aria-current="page">Login</a>
                <a href="dashboard.html" class="nav-link auth-link">Painel</a>
                <a href="admin.html" class="nav-link admin-link">Admin</a>
                <span class="auth-link" style="color:white;font-size:10px;padding:4px 8px;" id="auth-user-name"></span>
                <button class="btn btn-tiny auth-link" id="auth-logout-btn" style="margin-left:4px;">Sair</button>
                <button class="btn btn-tiny" id="theme-toggle" onclick="toggleTheme()" style="margin-left:10px;" title="Alternar tema">◐ Tema</button>
            </nav>
        </div>
    </header>

    <main class="main" id="main-content" role="main">
        <section class="signup-section">
            <div class="container">
                <div class="signup-container">
                    <div class="signup-form-wrapper">
                        <h1 class="section-title">Login do Afiliado</h1>
                        <p class="section-subtitle">Acesse seu painel personalizado</p>

                        <form id="login-form" class="signup-form">
                            <div class="form-group">
                                <label for="email" class="form-label">Email*</label>
                                <div class="form-input-wrapper">
                                    <input type="email" id="email" name="email"
                                        placeholder="seu.email@exemplo.com"
                                        class="form-input" required>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="password" class="form-label">Senha*</label>
                                <div class="form-input-wrapper">
                                    <input type="password" id="password" name="password"
                                        placeholder="Sua senha"
                                        class="form-input" required>
                                </div>
                                <div style="text-align:right;margin-top:5px;">
                                    <a href="forgot.html" style="font-size:10px;color:var(--color-text-light);">Esqueci minha senha</a>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-large">
                                Entrar
                            </button>
                        </form>

                        <div style="text-align:center;margin-top:20px;font-size:12px;">
                            <p>Ainda não tem conta? <a href="signup.html">Cadastre-se aqui</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer" role="contentinfo">
        <div class="container" style="text-align:center;padding:12px 0;border-top:2px solid #808080;">
            <a href="termos.html" style="color:#FFFF00;font-size:10px;margin:0 8px;">Termos de Uso</a>
            <a href="privacidade.html" style="color:#FFFF00;font-size:10px;margin:0 8px;">Privacidade</a>
            <span style="color:#808080;font-size:10px;margin:0 8px;">&copy; 2026 Indique e Ganhe</span>
        </div>
    </footer>

    <script>if (typeof twemoji !== 'undefined') { twemoji.parse(document.body, { folder: 'svg', ext: '.svg' }); }</script>
    <script src="src/storage.js"></script>
    <script src="src/utils.js"></script>
    <script src="src/affiliates.js"></script>
    <script src="src/tracking.js"></script>
    <script src="src/dashboard.js"></script>
    <script src="src/main.js"></script>
    <script src="src/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            updateAuthUI();

            var loginForm = document.getElementById('login-form');
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                var email = document.getElementById('email').value;
                var password = document.getElementById('password').value;
                var btn = loginForm.querySelector('button[type="submit"]');
                btn.disabled = true;
                btn.textContent = 'Entrando...';
                try {
                    await apiLogin(email, password);
                    window.location.href = 'dashboard.html';
                } catch (err) {
                    showToast('Erro: ' + err.message);
                    btn.disabled = false;
                    btn.textContent = 'Entrar';
                }
            });
        });
    </script>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function() {});
    }
    </script>
</body>
</html>

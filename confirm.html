<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Email - Indique e Ganhe</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <a href="#main-content" class="skip-link">Pular para conteúdo principal</a>
    <header role="banner">
        <div class="container">
            <div class="logo">
                <span class="logo-icon">▲</span>
                <span class="logo-text">Indique e Ganhe</span>
            </div>
            <button id="dark-toggle" aria-label="Alternar modo escuro">🌙</button>
        </div>
            <button id="dark-toggle" aria-label="Alternar modo escuro">🌙</button>
        </div>
    </header>
    <main id="main-content" role="main" class="main">
        <div class="container">
            <div class="signup-form-wrapper" style="max-width: 500px; margin: 0 auto; text-align: center; padding: 40px;">
                <div id="confirm-status">
                    <h2 style="margin-bottom: 20px;">Confirmando seu email...</h2>
                    <div class="skeleton" style="width: 50px; height: 50px; border-radius: 50%; margin: 20px auto;"></div>
                </div>
            </div>
        </div>
    </main>
    <footer role="contentinfo" class="footer">
        <div class="container">
            <p>Indique e Ganhe &copy; 2026</p>
        </div>
    </footer>
    <script>
    (function() {
        var params = new URLSearchParams(window.location.search);
        var token = params.get('token');
        if (!token) {
            document.getElementById('confirm-status').innerHTML = '<h2>Link inválido</h2><p>Token de confirmação não encontrado.</p>';
            return;
        }
        fetch('/api/auth/confirm', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({token: token})
        }).then(function(r) { return r.json(); }).then(function(data) {
            if (data.error) {
                document.getElementById('confirm-status').innerHTML = '<h2>Erro</h2><p>' + data.error + '</p>';
            } else {
                document.getElementById('confirm-status').innerHTML = '<h2>Email confirmado!</h2><p>Sua conta está ativa. <a href="/login.html">Faça login</a></p>';
            }
        }).catch(function() {
            document.getElementById('confirm-status').innerHTML = '<h2>Erro de conexão</h2><p>Tente novamente mais tarde.</p>';
        });
    })();
    </script>
</body>
</html>
